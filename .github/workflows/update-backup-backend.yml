name: Update Backend (VPS)

# Keeps the backend on the VPS in sync with master by SSH-ing in with a
# restricted deploy key. On the server that key can only run
# /data/home/valorant-backup/deploy.sh (git fetch + reset, pip install,
# restart valorant-backup, health check); it gets no shell.
#
# Requires the repository secret VPS_SSH_KEY (the deploy private key).
# Without it this workflow just prints a warning and exits.

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-backend
  cancel-in-progress: false

env:
  VPS_HOST: 74.222.12.182
  VPS_PORT: '22'
  VPS_USER: user
  # Public SSH host key of the VPS (pinned so the connection can't be intercepted).
  VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGNUcpu4pxfd+CwONLeKYx4yKMWyHE/Z2jEOpITJfYTj

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::VPS_SSH_KEY secret is not set; skipping the backend update."
            exit 0
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[$VPS_HOST]:$VPS_PORT $VPS_HOST_KEY" > ~/.ssh/known_hosts

          # The server's forced command runs the deploy script; the command
          # given here is ignored.
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 \
            "$VPS_USER@$VPS_HOST" deploy

          echo "Backend updated."
