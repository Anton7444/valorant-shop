name: Keep Backend Warm

on:
  schedule:
    # Render's free tier spins down after ~15 min idle; ping well inside that window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: curl -sf https://valorant-shop-checker-backend.onrender.com/api/health
